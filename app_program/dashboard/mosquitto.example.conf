# Example for local testing. Change for real WiFi access.
# Start with: mosquitto -c mosquitto.example.conf -v
listener 1883 127.0.0.1
allow_anonymous true
persistence false
# For LAN: listener 1883 0.0.0.0 ; allow_anonymous false ; password_file /secure/path/passwd
# Create credentials: mosquitto_passwd -c /secure/path/passwd robot7
# Use a proper ACL and firewall for any shared network.
